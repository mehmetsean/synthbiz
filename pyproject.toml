[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthbiz"
version = "0.1.0"
description = "Synthetic, reconciling finance data for one fictional small manufacturer, with labeled anomalies."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
dev = ["pytest", "pytest-cov", "hypothesis", "ruff", "mypy", "pyarrow>=15"]

[project.scripts]
synthbiz = "synthbiz.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/synthbiz"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
