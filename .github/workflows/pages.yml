name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: pytest --junitxml="$RUNNER_TEMP/junit.xml" --cov-report=json:"$RUNNER_TEMP/coverage.json"
      - run: pip wheel . --no-deps -w _site
      - run: python scripts/make_badges.py "$RUNNER_TEMP/coverage.json" "$RUNNER_TEMP/junit.xml" _site/badges
      - run: cp site/* _site/
      - run: |
          python -c "import glob, json; json.dump({'wheel': glob.glob('_site/*.whl')[0].split('/')[-1]}, open('_site/wheel.json', 'w'))"
      - if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: ${{ !github.event.repository.private && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
